        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
    dependencies:
      - package: FirebaseMessaging
        product: FirebaseMessaging

schemes:
  HARIVASStore:
    build:
      targets:
        HARIVASStore: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HARIVASRider:
    build:
      targets:
        HARIVASRider: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HARIVASVendor:
