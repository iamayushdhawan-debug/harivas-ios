    resources:
      - path: Assets/Admin
    info:
      path: Targets/Admin/Info.plist
    settings:
      base:
        PRODUCT_NAME: HARIVASAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.harivas.admin
        INFOPLIST_FILE: Targets/Admin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
